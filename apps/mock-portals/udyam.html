<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Udyam Registration</title><link rel="stylesheet" href="/mock/portal.css"></head><body><main><div class="banner">DEMO, NOT A GOVERNMENT SITE</div><section class="card"><h1>Udyam registration</h1><form data-step="details"><label for="business_name">Business name</label><input id="business_name" name="business_name" data-field="business_name"><label for="employees">Employees</label><input id="employees" name="employees" data-field="employees" inputmode="numeric"><button>Continue to review</button></form><div data-step="review" hidden><h2>Review</h2><p>Check the business details before continuing.</p><button>Continue to OTP</button></div><form data-step="otp" hidden><h2>Type OTP</h2><label for="otp">OTP</label><input id="otp" name="otp" data-field="otp" data-sensitive="true" autocomplete="one-time-code" inputmode="numeric"><small>Demo accepts any six digits.</small><button>Submit demo form</button></form><div data-step="success" hidden class="success"><h2>Success</h2><p>Demo Udyam application submitted.</p></div></section></main><script src="/mock/portal-bridge.js"></script><script src="/mock/portal.js"></script></body></html>
