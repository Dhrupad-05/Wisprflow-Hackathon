<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo SBI Deposit</title><link rel="stylesheet" href="/mock/portal.css"></head><body><main><div class="banner">DEMO, NOT A REAL BANK</div><section class="card"><h1>SBI-style deposit</h1><form data-step="details"><label for="account_no">Account number</label><input id="account_no" name="account_no" data-field="account_no" inputmode="numeric"><label for="amount">Amount</label><input id="amount" name="amount" data-field="amount" inputmode="decimal"><button>Continue to review</button></form><div data-step="review" hidden><h2>Review</h2><p>Check the details above before continuing.</p><button>Continue to OTP</button></div><form data-step="otp" hidden><h2>Type OTP</h2><label for="otp">OTP</label><input id="otp" name="otp" data-field="otp" data-sensitive="true" autocomplete="one-time-code" inputmode="numeric"><small>Demo accepts any six digits.</small><button>Submit demo form</button></form><div data-step="success" hidden class="success"><h2>Success</h2><p>Demo deposit submitted.</p></div></section></main><script src="/mock/portal-bridge.js"></script><script src="/mock/portal.js"></script></body></html>
