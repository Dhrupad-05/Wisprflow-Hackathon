<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bolo Sahayak Helper</title><style>body{font:14px system-ui;margin:18px;color:#152238}h1{font-size:22px}.card{border:1px solid #dce3ef;border-radius:12px;padding:12px;margin:12px 0}dt{color:#64748b;font-size:12px;text-transform:uppercase}dd{margin:4px 0 12px}ul{padding-left:20px}button{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid #cbd5e1;background:#f8fafc;cursor:pointer}button.primary{background:#1e3a8a;color:#fff;border-color:#1e3a8a}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}input{min-height:44px;flex:1;min-width:0;padding:0 10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}#prompt{font-weight:600}#heard{color:#475569;min-height:20px}</style></head><body><h1>Bolo Sahayak</h1><div class="card"><p id="prompt">Tap “Ask Bolo” or type below.</p><p id="heard"></p><div class="row"><button id="ask" class="primary">Ask Bolo (6s)</button><button id="yes">Yes</button><button id="no">No</button></div><div class="row"><input id="typed" placeholder="Type instead" aria-label="Type your answer"><button id="send">Send</button></div><p id="status">Idle</p></div><div class="card"><dl><dt>Status</dt><dd id="conn">Connecting…</dd><dt>Current portal</dt><dd id="portal">None</dd><dt>Page fields</dt><dd id="fields">0</dd></dl></div><div class="card"><strong>Allow-listed hosts</strong><ul id="allowlist"></ul></div><div class="card"><strong>Last fills</strong><ul id="fills"><li>None</li></ul></div><p>Mic capture runs here in the extension, never inside the bank page. OTP and passwords are typed by you.</p><script src="allowlist.js"></script><script type="module" src="sidepanel.js"></script></body></html>
